<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="MitroCare">
  <title>MitroCare mark</title>
  <defs>
    <linearGradient id="mc-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7C66B"/>
      <stop offset="1" stop-color="#9A7A38"/>
    </linearGradient>
  </defs>
  <!-- Sharp, forward-leaning M monogram. Miter joins = athletic, decisive, not soft. -->
  <g transform="translate(6,0) skewX(-8)">
    <path d="M8 38 L8 12 L22 28 L36 12 L36 38" fill="none" stroke="url(#mc-gold)"
          stroke-width="6.6" stroke-linejoin="miter" stroke-linecap="square"/>
  </g>
</svg>
