<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SKRALOVNIK — Anže Skralovnik</title>
  <meta name="description" content="SKRALOVNIK. Clarity, discipline and systems for personal and business growth.">
  <meta name="theme-color" content="#050607">
  <meta property="og:title" content="SKRALOVNIK">
  <meta property="og:image" content="assets/hero-poster.jpg">
  <link rel="icon" href="assets/symbol.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- only the letters the chapter words use -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&text=ABCDEILMNOPRSTUVabcdeilmnoprstuv&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Hero: 16:9 video, always full width. Silent by design. -->
  <header class="hero">
    <video class="hero__video" autoplay muted loop playsinline preload="auto"
           poster="assets/hero-poster.jpg" aria-hidden="true">
      <source src="assets/hero-mobile.mp4" type="video/mp4" media="(max-width: 719px)">
      <source src="assets/hero-desktop.mp4" type="video/mp4">
    </video>
    <div class="hero__veil" aria-hidden="true"></div>
    <h1 class="hero__title">
      <img class="hero__logo" src="assets/logo.svg" alt="SKRALOVNIK" width="266" height="116">
    </h1>
    <!-- Chapter of the film on screen; main.js switches it on each cut -->
    <p class="hero__chapter" aria-hidden="true">
      <span class="hero__rule"></span>
      <span class="hero__word">Present</span>
    </p>
    <div class="hero__progress" aria-hidden="true"><span></span></div>
  </header>

  <script src="main.js"></script>

  <!-- DRAFTPIN dev tool: loads only on localhost. Never runs in production. -->
  <script>
    if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
      var dp = document.createElement("script");
      dp.src = "./draftpin.dev.js";
      document.body.appendChild(dp);
    }
  </script>
</body>
</html>
