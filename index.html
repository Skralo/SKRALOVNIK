<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DRP · Razvoj dinamičnega podjetja — Anže Skralovnik</title>
<style>
  :root{
    --surface:#05080a;
    --gold:#f5d592;
    --muted:rgba(245,213,146,.45);
    --line:rgba(245,213,146,.18);
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;width:100%;background:var(--surface);overflow:hidden;font-family:var(--mono);}
  body.hide-cursor{cursor:none;}

  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--surface);}
  .slide{position:absolute;max-width:100%;max-height:100%;width:auto;height:auto;
         object-fit:contain;opacity:0;transition:opacity .14s ease;
         user-select:none;-webkit-user-drag:none;pointer-events:none;}
  .slide.active{opacity:1;}

  /* progress */
  #progress{position:fixed;left:0;bottom:0;height:2px;background:var(--gold);width:0;
            transition:width .18s ease;z-index:30;box-shadow:0 0 10px rgba(245,213,146,.5);}

  /* control bar */
  #bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
       display:flex;align-items:center;gap:14px;z-index:40;
       padding:9px 14px;border:1px solid var(--line);border-radius:0;
       background:rgba(5,8,10,.72);backdrop-filter:blur(8px);
       opacity:0;transition:opacity .3s ease;pointer-events:none;}
  #bar.show{opacity:1;pointer-events:auto;}
  #bar button{all:unset;cursor:pointer;color:var(--gold);font-family:var(--mono);font-size:13px;
              padding:4px 8px;line-height:1;opacity:.7;transition:opacity .15s;}
  #bar button:hover{opacity:1;}
  #counter{color:var(--gold);font-family:var(--mono);font-size:12px;letter-spacing:1px;
           min-width:54px;text-align:center;opacity:.85;}
  #counter b{color:#fff;}
  .sep{width:1px;height:16px;background:var(--line);}

  /* hint */
  #hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
        z-index:50;text-align:center;color:var(--gold);
        font-family:var(--mono);font-size:13px;letter-spacing:1px;line-height:2;
        background:rgba(5,8,10,.82);border:1px solid var(--line);padding:22px 30px;
        opacity:0;transition:opacity .5s ease;pointer-events:none;}
  #hint.show{opacity:1;}
  #hint .k{color:#fff;}
  #hint .t{color:var(--muted);font-size:11px;margin-top:14px;letter-spacing:2px;}

  /* overview grid */
  #grid{position:fixed;inset:0;z-index:60;background:rgba(5,8,10,.96);
        display:none;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
        gap:14px;padding:32px;overflow:auto;align-content:start;}
  #grid.show{display:grid;}
  #grid figure{margin:0;cursor:pointer;border:1px solid var(--line);transition:border-color .15s,transform .15s;}
  #grid figure:hover{border-color:var(--gold);transform:translateY(-2px);}
  #grid img{width:100%;display:block;}
  #grid figcaption{color:var(--muted);font-size:11px;font-family:var(--mono);padding:5px 8px;letter-spacing:1px;}
  #grid figure.cur{border-color:var(--gold);}
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="progress"></div>

  <div id="grid"></div>

  <div id="hint">
    <div><span class="k">&larr; &rarr;</span> listanje slajdov</div>
    <div><span class="k">F</span> celozaslon &nbsp;&middot;&nbsp; <span class="k">ESC</span> izhod</div>
    <div><span class="k">G</span> pregled vseh &nbsp;&middot;&nbsp; <span class="k">Home/End</span> prvi/zadnji</div>
    <div class="t">DRP · ANŽE SKRALOVNIK</div>
  </div>

  <div id="bar">
    <button id="prev" title="Nazaj (←)">&larr;</button>
    <span id="counter"><b>1</b> / 8</span>
    <button id="next" title="Naprej (→)">&rarr;</button>
    <span class="sep"></span>
    <button id="gridBtn" title="Pregled (G)">▦</button>
    <button id="fsBtn" title="Celozaslon (F)">⤢</button>
  </div>

<script>
  const SLIDES = ["./slides/slide-1.png", "./slides/slide-2.png", "./slides/slide-3.png", "./slides/slide-4.png", "./slides/slide-5.png", "./slides/slide-6.png", "./slides/slide-7.png", "./slides/slide-8.png"];
  const n = SLIDES.length;
  let i = 0;

  const stage = document.getElementById('stage');
  const counter = document.getElementById('counter');
  const progress = document.getElementById('progress');
  const bar = document.getElementById('bar');
  const hint = document.getElementById('hint');
  const grid = document.getElementById('grid');

  // build + preload all slides
  const imgs = SLIDES.map((src,idx)=>{
    const im = document.createElement('img');
    im.className='slide'; im.src=src; im.alt='Slajd '+(idx+1);
    im.decoding='sync'; im.draggable=false;
    stage.appendChild(im);
    return im;
  });

  function render(){
    imgs.forEach((im,idx)=>im.classList.toggle('active', idx===i));
    counter.innerHTML='<b>'+(i+1)+'</b> / '+n;
    progress.style.width=((i+1)/n*100)+'%';
    [...grid.children].forEach((f,idx)=>f.classList.toggle('cur',idx===i));
  }
  function go(d){ i=Math.max(0,Math.min(n-1,i+d)); render(); }
  function goto(x){ i=Math.max(0,Math.min(n-1,x)); render(); }

  // fullscreen
  function toggleFS(){
    if(!document.fullscreenElement){
      (document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen).call(document.documentElement);
    } else {
      (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    }
  }

  // grid overview
  function buildGrid(){
    SLIDES.forEach((src,idx)=>{
      const fig=document.createElement('figure');
      const im=document.createElement('img'); im.src=src; im.loading='lazy';
      const cap=document.createElement('figcaption'); cap.textContent=String(idx+1).padStart(2,'0');
      fig.append(im,cap);
      fig.onclick=()=>{ goto(idx); toggleGrid(false); };
      grid.appendChild(fig);
    });
  }
  let gridOpen=false;
  function toggleGrid(force){
    gridOpen = (force===undefined)? !gridOpen : force;
    grid.classList.toggle('show',gridOpen);
  }

  // keyboard
  const NEXT=['ArrowRight','ArrowDown','PageDown',' ','Spacebar','n','N'];
  const PREV=['ArrowLeft','ArrowUp','PageUp','p','P','Backspace'];
  document.addEventListener('keydown',e=>{
    if(NEXT.includes(e.key)){ e.preventDefault(); if(gridOpen){toggleGrid(false);} go(1); }
    else if(PREV.includes(e.key)){ e.preventDefault(); if(gridOpen){toggleGrid(false);} go(-1); }
    else if(e.key==='Home'){ e.preventDefault(); goto(0); }
    else if(e.key==='End'){ e.preventDefault(); goto(n-1); }
    else if(e.key==='f'||e.key==='F'){ e.preventDefault(); toggleFS(); }
    else if(e.key==='g'||e.key==='G'){ e.preventDefault(); toggleGrid(); }
    else if(e.key==='Escape'){ if(gridOpen){ e.preventDefault(); toggleGrid(false);} }
  });

  // buttons
  document.getElementById('next').onclick=()=>go(1);
  document.getElementById('prev').onclick=()=>go(-1);
  document.getElementById('fsBtn').onclick=toggleFS;
  document.getElementById('gridBtn').onclick=()=>toggleGrid();

  // click left/right thirds to navigate (not on the bar)
  stage.addEventListener('click',e=>{
    if(gridOpen) return;
    const x=e.clientX/window.innerWidth;
    if(x>0.55) go(1); else if(x<0.45) go(-1);
  });

  // swipe
  let tx=0,ty=0;
  document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
  document.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)){ dx<0?go(1):go(-1); }
  },{passive:true});

  // controls + cursor auto-hide
  let idle;
  function activity(){
    bar.classList.add('show'); document.body.classList.remove('hide-cursor');
    clearTimeout(idle);
    idle=setTimeout(()=>{ bar.classList.remove('show'); 
      if(document.fullscreenElement) document.body.classList.add('hide-cursor'); },2600);
  }
  ['mousemove','mousedown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,activity,{passive:true}));

  // init
  buildGrid(); render(); activity();
  hint.classList.add('show'); setTimeout(()=>hint.classList.remove('show'),4200);
</script>
</body>
</html>
